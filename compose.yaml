services:
  pipa-server:
    image: ${PIPA_SERVER_IMAGE:-ghcr.io/pipa-os/pipa-server:0.1.3}
    container_name: pipa-server
    ports:
      - "8080:8080"   # web console / OpenAPI
    environment:
      PIPA_OPENAPI_ADDR: "0.0.0.0:8080"
      # Override the agent socket path if yours differs:
      # PIPA_AGENT_SOCKET: "/run/pipa/pipa-agent.sock"
    volumes:
      - pipa-appstore:/var/lib/pipa-server/appstore
      # Host container runtime socket: pipa-server drives the host runtime
      # directly over its Docker-compatible API. Mount this by default.
      # If the host runs podman (rootful) instead of docker, replace the line
      # below with: /run/podman/podman.sock:/run/podman/podman.sock
      - /var/run/docker.sock:/var/run/docker.sock
      # - /run/podman/podman.sock:/run/podman/podman.sock
      # Host pipa-agent socket (uncomment when running alongside pipa-agent):
      # - /run/pipa:/run/pipa:ro
    restart: unless-stopped


volumes:
  pipa-appstore:
