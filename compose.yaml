services:
  pipa-server:
    image: ${PIPA_SERVER_IMAGE:-ghcr.io/pipa-os/pipa-server:0.1.7}
    container_name: pipa-server
    ports:
      - "8080:8080"   # web console / OpenAPI
    environment:
      PIPA_OPENAPI_ADDR: "0.0.0.0:8080"
      # Host path (on the runtime machine) where app data volumes are created.
      # A rootless runtime runs as your user and cannot write /var/pipa-data, so
      # set PIPA_DATA_DIR (via .env) to a path under the runtime user's home.
      PIPA_DATA_DIR: ${PIPA_DATA_DIR:-/var/pipa-data}
      # Override the agent socket path if yours differs:
      # PIPA_AGENT_SOCKET: "/run/pipa/pipa-agent.sock"
    volumes:
      # Persisted state — named volumes survive container destroy/recreate:
      - pipa-appstore:/var/lib/pipa-server/appstore   # installed apps catalog
      - pipa-auth:/var/lib/pipa-server/auth           # local accounts & sessions
      - pipa-webdav:/var/lib/pipa-server/webdav        # uploaded files
      # Host container runtime socket: pipa-server drives the host runtime over
      # its Docker-compatible API. The container side is always
      # /var/run/docker.sock; the SOURCE depends on how the host runs it:
      #   rootful docker         -> /var/run/docker.sock (default)
      #   rootless docker/podman -> per-user socket, e.g. /run/user/1000/docker.sock
      #   rootful podman         -> /run/podman/podman.sock
      # Override the source with PIPA_RUNTIME_SOCKET (in .env or the shell).
      - ${PIPA_RUNTIME_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # Host pipa-agent socket (uncomment when running alongside pipa-agent):
      # - /run/pipa:/run/pipa:ro
    restart: unless-stopped


volumes:
  pipa-appstore:
  pipa-auth:
  pipa-webdav:
