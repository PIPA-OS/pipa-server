services:
  pipa-server:
    image: ${PIPA_SERVER_IMAGE:-ghcr.io/pipa-os/pipa-server:0.1.0}
    container_name: pipa-server
    ports:
      - "8080:8080"   # web console / OpenAPI
    environment:
      PIPA_OPENAPI_ADDR: "0.0.0.0:8080"
      # Override the agent socket path if yours differs:
      # PIPA_AGENT_SOCKET: "/run/pipa/pipa-agent.sock"
    volumes:
      - pipa-appstore:/var/lib/pipa-server/appstore
      # 容器运行时 socket：pipa-server 通过它直接管理宿主机上的容器。
      # 默认按 docker 挂载；若宿主机用的是 podman（rootful），把下面这行换成
      # /run/podman/podman.sock:/run/podman/podman.sock 即可。
      - /var/run/docker.sock:/var/run/docker.sock
      # - /run/podman/podman.sock:/run/podman/podman.sock
      # Host pipa-agent socket (uncomment when running alongside pipa-agent):
      # - /run/pipa:/run/pipa:ro
    restart: unless-stopped

volumes:
  pipa-appstore:
